name: Build and Deploy OS13k Apps

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------
  # JOB 1: BUILD (Creates the 'dist' folder)
  # ----------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create deployment directory
        run: |
          mkdir -p dist/os13k-full
          mkdir -p dist/js13k

      # Copy your project files to dist/
      - name: Copy OS13k Full Version
        run: |
          cp -r index.html dist/os13k-full/
          cp -r favicon.ico dist/os13k-full/
          cp -r help.html dist/os13k-full/
          cp -r programs.js dist/os13k-full/
          cp -r OS13k dist/os13k-full/
          cp -r apps dist/os13k-full/
          cp -r controller dist/os13k-full/
          cp -r dweets dist/os13k-full/
          cp -r games dist/os13k-full/
          cp -r music dist/os13k-full/
          cp -r shaders dist/os13k-full/
          cp -r system dist/os13k-full/
          mkdir -p dist/os13k-full/node_modules/peerjs/dist
          cp -r node_modules/peerjs/dist/peerjs.min.js dist/os13k-full/node_modules/peerjs/dist/

      - name: Copy JS13k Build Version
        run: |
          cp -r JS13k/index.html dist/js13k/
          cp -r JS13k/index.min.html dist/js13k/
          cp -r JS13k/index.js dist/js13k/
          cp favicon.ico dist/js13k/
          if [ -f JS13k/OS13k.zip ]; then
            cp JS13k/OS13k.zip dist/js13k/
          fi

      # Create the landing page
      - name: Create root index page
        run: |
          cat > dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>OS13k - Choose Version</title>
              <meta http-equiv="refresh" content="0; url=os13k-full/">
          </head>
          <body>
              <p>Redirecting to <a href="os13k-full/">OS13k Full Version</a>...</p>
          </body>
          </html>
          EOF

      # --- PREPARE FILES FOR DEPLOYMENT ---

      # 1. Upload for GitHub Pages (Special Format)
      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 2. Upload for FTP (Standard Format) - NEW STEP
      # We must save the 'dist' folder so the FTP job can see it later
      - name: Upload artifact for FTP
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist

  # ----------------------------------------------------------------
  # JOB 2: DEPLOY TO GITHUB PAGES
  # ----------------------------------------------------------------
  deploy-gh-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ----------------------------------------------------------------
  # JOB 3: DEPLOY TO FTP (YOUR SERVER) - NEW JOB
  # ----------------------------------------------------------------
  deploy-ftp:
    environment:
      name: ftp-production
      url: http://www.test.1ink.us.com/web-mouse/  # <--- Optional: Put your actual URL here
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      # Download the 'dist' folder we saved in the build step
      - name: Download built website
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist

      # Sync to your FTP server
      - name: 📂 Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          
          # Tells the action to upload the contents of the 'dist' folder...
          local-dir: ./dist/
          
          # ...into this specific folder on your server.
          # Based on your Python script, it looks like your website folders 
          # are inside a directory named "test.1ink.us".
          server-dir: test.1ink.us/web-mouse/
          
          # CRITICAL: Your Python script uses Port 22 (SSH/SFTP). 
          # You must set this to 'sftp' or the action will try Port 21 and fail.
          protocol: sftp
          port: 22
